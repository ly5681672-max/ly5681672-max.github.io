name: Build Jekyll Auto Header Web Extension

on:
  push:
    branches: [main]
    paths:
      - "vscode-extension/jekyll-auto-header/**"
      - ".github/workflows/build-jekyll-auto-header-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension/jekyll-auto-header
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Build browser and desktop bundles
        run: npm run build
      - name: Package web extension
        run: npx --yes @vscode/vsce package --target web
      - uses: actions/upload-artifact@v4
        with:
          name: jekyll-auto-header-web-vsix
          path: vscode-extension/jekyll-auto-header/*.vsix
          if-no-files-found: error
