name: Automatically create Jekyll post headers

# Automatic post generation is handled by deploy.yml before Jekyll builds.
# Keep this workflow as a manual recovery command to avoid competing writes.
on:
  workflow_dispatch:
    inputs:
      post_path:
        description: "Optional path to an existing _posts/YYYY-MM-DD-name.md file"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: new-post-header-main
  cancel-in-progress: false

jobs:
  add-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog 🛎️
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test post-header generation 🧪
        run: python -m unittest discover -s test -p test_post_frontmatter.py

      - name: Add headers to changed posts 📝
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          POST_PATH: ${{ inputs.post_path }}
        run: |
          if [ -n "$POST_PATH" ]; then
            python scripts/ensure_post_frontmatter.py --path "$POST_PATH"
          else
            python scripts/ensure_post_frontmatter.py --before "$BEFORE" --after "$AFTER"
          fi

      - name: Save new post headers to main ✅
        id: save
        run: |
          if git diff --quiet -- _posts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- _posts
          git commit -m "Automatically add Jekyll front matter to new posts"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Changes pushed with GITHUB_TOKEN do not trigger normal push workflows.
      # Explicit dispatch is necessary so the generated header is published.
      - name: Publish completed posts 🚀
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
